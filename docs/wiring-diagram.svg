<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" width="1000" height="1300" role="img" aria-label="DUAL wiring: two CC3200 LaunchPads wired identically. Each board: UART0 USB console on PIN_55/PIN_57, on-board I2C0 accelerometer 0x18 on PIN_01/PIN_02, IR receiver DATA on PIN_61 with VCC through a resistor R and a capacitor C to GND, SSD1351 OLED with CS PIN_18, RESET PIN_62, DC PIN_45, SCK PIN_05, MOSI PIN_07 and GND/3V3, SW3 fire button on PIN_04. UART1 crossover between boards at 115200 8N1: board 1 PIN_08 to board 2 PIN_58 and board 1 PIN_58 to board 2 PIN_08; GND shared between the boards.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:#f6f8fa;stroke:#818b98;stroke-width:1.5;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{fill:#151b23;stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="1300" rx="12"/>
  <text class="title" x="32" y="48">DUAL — two CC3200 LaunchPads, full wiring</text>
  <text class="sub" x="32" y="74">Both boards are wired the same and flashed with a different PLAYER_MODE; UART1 crosses over and GND is shared.</text>

  <!-- ===== Board 1 ===== -->
  <rect class="group" x="16" y="92" width="968" height="520" rx="12"/>
  <text class="glbl" x="118" y="114">BOARD 1 — PLAYER_MODE 1 = RED</text>
  <rect class="b-blue" x="400" y="128" width="230" height="354" rx="10"/>
  <text class="lbl" x="515" y="154" text-anchor="middle">CC3200 LaunchPad</text>
  <text class="note mono" x="412" y="192">VCC</text>
  <text class="note mono" x="412" y="216">GND</text>
  <text class="note mono" x="412" y="240">PIN_61</text>
  <text class="note mono" x="412" y="316">PIN_55</text>
  <text class="note mono" x="412" y="340">PIN_57</text>
  <text class="note mono" x="412" y="420">PIN_01</text>
  <text class="note mono" x="412" y="444">PIN_02</text>
  <text class="note mono" x="618" y="192" text-anchor="end">PIN_08</text>
  <text class="note mono" x="618" y="216" text-anchor="end">PIN_58</text>
  <text class="note mono" x="618" y="340" text-anchor="end">PIN_18</text>
  <text class="note mono" x="618" y="364" text-anchor="end">PIN_62</text>
  <text class="note mono" x="618" y="388" text-anchor="end">PIN_45</text>
  <text class="note mono" x="618" y="412" text-anchor="end">PIN_05</text>
  <text class="note mono" x="618" y="436" text-anchor="end">PIN_07</text>
  <text class="note" x="515" y="468" text-anchor="middle">SW3 fire button = PIN_04</text>
  <rect class="b-gray" x="118" y="268" width="234" height="84" rx="10"/>
  <text class="lbl" x="235" y="293" text-anchor="middle">UART0 — USB console</text>
  <text class="note mono" x="340" y="316" text-anchor="end">UART0_TX</text>
  <text class="note mono" x="340" y="340" text-anchor="end">UART0_RX</text>
  <rect class="b-orange" x="118" y="372" width="234" height="84" rx="10"/>
  <text class="lbl" x="235" y="397" text-anchor="middle">I2C0 — on-board accel (0x18)</text>
  <text class="note mono" x="340" y="420" text-anchor="end">I2C_SCL</text>
  <text class="note mono" x="340" y="444" text-anchor="end">I2C_SDA</text>
  <path class="wire" d="M352,312 H400"/>
  <path class="wire" d="M352,336 H400"/>
  <path class="wire" d="M352,416 H400"/>
  <path class="wire" d="M352,440 H400"/>
  <rect class="b-orange" x="118" y="488" width="156" height="108" rx="10"/>
  <text class="lbl" x="196" y="513" text-anchor="middle">IR receiver</text>
  <text class="note mono" x="130" y="536">DATA</text>
  <text class="note mono" x="130" y="560">GND</text>
  <text class="note mono" x="130" y="584">VCC</text>
  <path class="wire" d="M274,542 H291"/>
  <circle class="b-orange" data-part="IR window" cx="300" cy="542" r="9"/>
  <path class="edge" d="M352,502 L314,527" marker-end="url(#ah)"/>
  <path class="edge" d="M362,516 L322,542" marker-end="url(#ah)"/>
  <text class="elbl" x="336" y="570">IR from remote</text>
  <rect class="b-purple" x="690" y="236" width="190" height="212" rx="10"/>
  <text class="lbl" x="785" y="261" text-anchor="middle">SSD1351 OLED 128×128</text>
  <text class="note mono" x="702" y="292">GND</text>
  <text class="note mono" x="702" y="316">VCC</text>
  <text class="note mono" x="702" y="340">GSPI_CS</text>
  <text class="note mono" x="702" y="364">GSPI_RESET</text>
  <text class="note mono" x="702" y="388">GSPI_DC</text>
  <text class="note mono" x="702" y="412">GSPI_SCK</text>
  <text class="note mono" x="702" y="436">GSPI_MOSI</text>
  <path class="wire" d="M630,336 H690"/>
  <path class="wire" d="M630,360 H690"/>
  <path class="wire" d="M630,384 H690"/>
  <path class="wire" d="M630,408 H690"/>
  <path class="wire" d="M630,432 H690"/>
  <path class="wire" d="M880,288 H904"/>
  <text class="elbl" x="909" y="292">GND</text>
  <path class="wire" d="M880,312 H904"/>
  <text class="elbl" x="909" y="316">3V3</text>
  <path class="wire" d="M400,236 H96 V532 H118"/>
  <path class="wire" d="M400,188 H48 V338"/>
  <rect class="wire" data-part="R1" x="42" y="338" width="12" height="28"/>
  <text class="elbl" x="36" y="356" text-anchor="end">R</text>
  <path class="wire" d="M48,366 V580 H66 A6,6 0 0 1 78,580 H118"/>
  <path class="wire" d="M48,506 H58"/>
  <path class="wire" data-part="C1a" d="M58,498 V514"/>
  <path class="wire" data-part="C1b" d="M62,498 V514"/>
  <path class="wire" d="M62,506 H72"/>
  <circle class="dot" cx="48" cy="506" r="3"/>
  <circle class="dot" cx="72" cy="506" r="3"/>
  <text class="elbl" x="36" y="510" text-anchor="end">C</text>
  <path class="wire" d="M72,556 H118"/>

  <!-- ===== Board 2 ===== -->
  <rect class="group" x="16" y="676" width="968" height="520" rx="12"/>
  <text class="glbl" x="118" y="698">BOARD 2 — PLAYER_MODE 0 = BLUE</text>
  <rect class="b-blue" x="400" y="712" width="230" height="354" rx="10"/>
  <text class="lbl" x="515" y="738" text-anchor="middle">CC3200 LaunchPad</text>
  <text class="note mono" x="412" y="776">VCC</text>
  <text class="note mono" x="412" y="800">GND</text>
  <text class="note mono" x="412" y="824">PIN_61</text>
  <text class="note mono" x="412" y="900">PIN_55</text>
  <text class="note mono" x="412" y="924">PIN_57</text>
  <text class="note mono" x="412" y="1004">PIN_01</text>
  <text class="note mono" x="412" y="1028">PIN_02</text>
  <text class="note mono" x="618" y="776" text-anchor="end">PIN_08</text>
  <text class="note mono" x="618" y="800" text-anchor="end">PIN_58</text>
  <text class="note mono" x="618" y="924" text-anchor="end">PIN_18</text>
  <text class="note mono" x="618" y="948" text-anchor="end">PIN_62</text>
  <text class="note mono" x="618" y="972" text-anchor="end">PIN_45</text>
  <text class="note mono" x="618" y="996" text-anchor="end">PIN_05</text>
  <text class="note mono" x="618" y="1020" text-anchor="end">PIN_07</text>
  <text class="note" x="515" y="1052" text-anchor="middle">SW3 fire button = PIN_04</text>
  <rect class="b-gray" x="118" y="852" width="234" height="84" rx="10"/>
  <text class="lbl" x="235" y="877" text-anchor="middle">UART0 — USB console</text>
  <text class="note mono" x="340" y="900" text-anchor="end">UART0_TX</text>
  <text class="note mono" x="340" y="924" text-anchor="end">UART0_RX</text>
  <rect class="b-orange" x="118" y="956" width="234" height="84" rx="10"/>
  <text class="lbl" x="235" y="981" text-anchor="middle">I2C0 — on-board accel (0x18)</text>
  <text class="note mono" x="340" y="1004" text-anchor="end">I2C_SCL</text>
  <text class="note mono" x="340" y="1028" text-anchor="end">I2C_SDA</text>
  <path class="wire" d="M352,896 H400"/>
  <path class="wire" d="M352,920 H400"/>
  <path class="wire" d="M352,1000 H400"/>
  <path class="wire" d="M352,1024 H400"/>
  <rect class="b-orange" x="118" y="1072" width="156" height="108" rx="10"/>
  <text class="lbl" x="196" y="1097" text-anchor="middle">IR receiver</text>
  <text class="note mono" x="130" y="1120">DATA</text>
  <text class="note mono" x="130" y="1144">GND</text>
  <text class="note mono" x="130" y="1168">VCC</text>
  <path class="wire" d="M274,1126 H291"/>
  <circle class="b-orange" data-part="IR window" cx="300" cy="1126" r="9"/>
  <path class="edge" d="M352,1086 L314,1111" marker-end="url(#ah)"/>
  <path class="edge" d="M362,1100 L322,1126" marker-end="url(#ah)"/>
  <text class="elbl" x="336" y="1154">IR from remote</text>
  <rect class="b-purple" x="690" y="820" width="190" height="212" rx="10"/>
  <text class="lbl" x="785" y="845" text-anchor="middle">SSD1351 OLED 128×128</text>
  <text class="note mono" x="702" y="876">GND</text>
  <text class="note mono" x="702" y="900">VCC</text>
  <text class="note mono" x="702" y="924">GSPI_CS</text>
  <text class="note mono" x="702" y="948">GSPI_RESET</text>
  <text class="note mono" x="702" y="972">GSPI_DC</text>
  <text class="note mono" x="702" y="996">GSPI_SCK</text>
  <text class="note mono" x="702" y="1020">GSPI_MOSI</text>
  <path class="wire" d="M630,920 H690"/>
  <path class="wire" d="M630,944 H690"/>
  <path class="wire" d="M630,968 H690"/>
  <path class="wire" d="M630,992 H690"/>
  <path class="wire" d="M630,1016 H690"/>
  <path class="wire" d="M880,872 H904"/>
  <text class="elbl" x="909" y="876">GND</text>
  <path class="wire" d="M880,896 H904"/>
  <text class="elbl" x="909" y="900">3V3</text>
  <path class="wire" d="M400,820 H96 V1116 H118"/>
  <path class="wire" d="M48,922 V772 H66 A6,6 0 0 1 78,772 H400"/>
  <rect class="wire" data-part="R2" x="42" y="922" width="12" height="28"/>
  <text class="elbl" x="36" y="940" text-anchor="end">R</text>
  <path class="wire" d="M48,950 V1164 H118"/>
  <path class="wire" d="M48,1090 H58"/>
  <path class="wire" data-part="C2a" d="M58,1082 V1098"/>
  <path class="wire" data-part="C2b" d="M62,1082 V1098"/>
  <path class="wire" d="M62,1090 H72"/>
  <circle class="dot" cx="48" cy="1090" r="3"/>
  <circle class="dot" cx="72" cy="1090" r="3"/>
  <text class="elbl" x="36" y="1094" text-anchor="end">C</text>

  <!-- ===== Between the boards ===== -->
  <path class="wire" d="M400,212 H72 V1140 H118"/>
  <path class="wire" d="M72,796 H400"/>
  <circle class="dot" cx="72" cy="556" r="3"/>
  <circle class="dot" cx="72" cy="796" r="3"/>
  <text class="elbl" x="82" y="646">GND (shared)</text>
  <path class="wire" d="M630,188 H966 V796 H630"/>
  <path class="wire" d="M630,212 H950 V772 H630"/>
  <text class="elbl" x="938" y="638" text-anchor="end">UART1 — 115200 8N1</text>
  <text class="elbl" x="938" y="654" text-anchor="end">crossover: PIN_58 (TX) → PIN_08 (RX), both ways</text>

  <!-- ===== Legend ===== -->
  <text class="glbl" x="32" y="1230">LEGEND</text>
  <rect class="b-blue" x="32" y="1244" width="26" height="14" rx="4"/>
  <text class="note" x="70" y="1255">CC3200 LaunchPad</text>
  <rect class="b-purple" x="272" y="1244" width="26" height="14" rx="4"/>
  <text class="note" x="310" y="1255">SSD1351 OLED display</text>
  <rect class="b-orange" x="512" y="1244" width="26" height="14" rx="4"/>
  <text class="note" x="550" y="1255">sensors / inputs</text>
  <rect class="b-gray" x="752" y="1244" width="26" height="14" rx="4"/>
  <text class="note" x="790" y="1255">USB console</text>
  <path class="wire" d="M32,1273 H58"/>
  <text class="note" x="70" y="1277">wire</text>
  <path class="wire" d="M272,1273 H298"/>
  <path class="wire" d="M285,1266 V1280"/>
  <circle class="dot" cx="285" cy="1273" r="3"/>
  <text class="note" x="310" y="1277">dot = wires joined</text>
  <path class="wire" d="M512,1273 H519 A6,6 0 0 1 531,1273 H538"/>
  <path class="wire" d="M525,1265 V1281"/>
  <text class="note" x="550" y="1277">hop = wires cross, not joined</text>
  <path class="edge" d="M752,1267 L772,1279" marker-end="url(#ah)"/>
  <text class="note" x="790" y="1277">IR light (not a wire)</text>
</svg>
